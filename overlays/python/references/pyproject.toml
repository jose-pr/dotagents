[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license fields need 1.27
build-backend = "hatchling.build"

[project]
name = "<project_name>"
version = "0.1.0"
authors = [{ name = "<copyright_holder>" }]
description = "<one-line description>"
readme = "README.md"
requires-python = ">=3.9"
# PEP 639: SPDX license expression + the file(s) it refers to. This replaces the
# legacy `License ::` classifier (do NOT also list one -- modern build backends
# reject the pair).
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    # EXECUTOR: no "License ::" classifier — the license/license-files fields above
    # (PEP 639) supersede it; declaring both makes modern build backends warn.
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    # Ship src/<package_name>/py.typed alongside this (kb/PYTHON.md).
    "Typing :: Typed",
]
# Zero required runtime deps where feasible; integrations go in extras (kb/PYTHON.md).
dependencies = []

[project.optional-dependencies]
# EXECUTOR: one extra per optional integration, guarded in code by try/except ImportError.
"<extra>" = ["<dependency>"]
dev = ["black", "build", "pytest"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/<gh_org>/<project_name>/"
Documentation = "https://<gh_org>.github.io/<project_name>/"
Issues = "https://github.com/<gh_org>/<project_name>/issues"

# Personal overrides (`*.local.*`) and agent config (`CLAUDE*`) never ship, even
# from a tree without its .gitignore (a copy, an sdist rebuild).
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/benchmarks", "*.local.*", "CLAUDE*"]

# Explicit, so it works whether or not the import name matches the
# distribution name (hatchling only guesses the matching case).
[tool.hatch.build.targets.wheel]
packages = ["src/<package_name>"]
exclude = ["*.local.*", "CLAUDE*"]

# Formatting is black (kb/PYTHON.md); target the requires-python floor.
[tool.black]
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
