name = "python"
description = "Python repo conventions: kb, pyproject/mkdocs templates, CI workflows. Ships `dotagents pyvenv` / `dotagents py`: version-pinned project venvs in <project>/.venv/ (~/.venv for one-off runs)."
requires = ["engineering"]
routing = [
  """- Python work → $PYTHON_OVERLAY_ROOT/kb/PYTHON.md""",
  """- Design, name or document a Python library (public API, exceptions, sync/async,
  README and AGENTS.md format, comments, preferred libraries, a library's CLI, a
  protocol library) →
  $PYTHON_OVERLAY_ROOT/standards/README.md, then the file it names""",
  """- Run Python, or need a version-pinned venv → `dotagents py [version] -- <args>` (~/.venv unless the project made its own .venv with `dotagents pyvenv`)""",
]
