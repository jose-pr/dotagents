name = "python"
description = "Python repo conventions and library standards: kb, pyproject/mkdocs templates, CI workflows. Ships `dotagents pyvenv` (project venvs in <project>/.pyvenv/, -g in ~/.pyvenv/) and `dotagents py`."
requires = ["engineering"]
routing = [
  """- Python work → $PYTHON_OVERLAY_ROOT/kb/PYTHON.md""",
  """- Design, name or document a Python library (public API, exceptions, sync/async,
  README and AGENTS.md format, comments, preferred libraries, a library's CLI, a
  protocol library) →
  $PYTHON_OVERLAY_ROOT/standards/README.md, then the file it names""",
  """- Make a Python venv → `dotagents pyvenv [version]` (`<project>/.pyvenv/`; `-g`
  for `~/.pyvenv/`); run in one → `dotagents py [version] -- <args>`""",
]
