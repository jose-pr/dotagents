name = "private-sync"
description = "One private git repo for per-user + per-project .agents: each project's .agents is a worktree of its own branch (or a link to projects/<name>), synced via git, auto-linked in cloud sessions."
requires = []
routing = [
  """- Set up or understand private-agents git sync — make ~/.agents a private repo,
  check a project's .agents out as its branch of ~/.agents, or wire cloud auto-linking →
  $PRIVATE_SYNC_OVERLAY_ROOT/kb/PRIVATE_SYNC.md""",
]

# Syncing a store is git.
[runtime]
commands = ["git"]

# Pull and link when a session starts; push back after each turn. Off until the user allows them
# (`dotagents overlays allow-hooks private-sync`). A hook that fails is reported and the session
# goes on: neither is a guard.
[hooks]
session-start = { run = "hooks/private-sync-start.sh", timeout = 60 }
turn-end = { run = "hooks/private-sync-stop.sh", timeout = 60 }
