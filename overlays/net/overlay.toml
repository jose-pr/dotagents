name = "net"
description = "Dependency-free HTTP tooling: a drop-in curl shim (real curl first, pure-stdlib fallback), an OS-trust-store certifi shim, and an httplib session toolkit reading AGENTS_PROXY (credentials from the URL or AGENTS_PROXY_AUTH, NO_PROXY honoured; the curl shim hands the same proxy to real curl). bin/ and lib/ are wired by dotagents env (PATH, PYTHONPATH, NET_OVERLAY_ROOT); no setup."
requires = []
routing = [
  """- Fetch a URL without network setup, use the bundled curl shim / httplib session
  toolkit, or point tools at the OS trust store → $NET_OVERLAY_ROOT/kb/NET.md""",
]
