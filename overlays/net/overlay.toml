name = "net"
description = "Dependency-free HTTP tooling: a drop-in curl shim (real curl first, pure-stdlib fallback), an OS-trust-store certifi shim, and an httplib session toolkit reading AGENTS_PROXY. bin/ and lib/ are wired by dotagents env (PATH, PYTHONPATH, NET_OVERLAY_ROOT); its setup script only adds the NET_ROOT alias."
requires = []
routing = [
  """- Fetch a URL without network setup, use the bundled curl shim / httplib session
  toolkit, or point tools at the OS trust store → ~/.agents/kb/NET.md""",
]
