name = "net"
description = "HTTP tooling for agents: a drop-in curl launcher (lib/curlshim: the real curl with the agent proxy added, else curlike, a curl-compatible command over the standard library), an OS-trust-store certifi shim, and syshttp (proxy, jars, hooks, an HTTP client on the standard library) -- both installed from PyPI into the agents venv from requirements.txt. env.py sets SYSHTTP_PREFIX=AGENTS_, so every setting is read as AGENTS_<NAME> and nothing unprefixed (AGENTS_SYSHTTP_PROXY with AGENTS_SYSHTTP_PROXY_AUTH and AGENTS_SYSHTTP_PROXY_TYPE, AGENTS_HTTPS_PROXY, AGENTS_NO_PROXY, AGENTS_SYSHTTP_HOOKS_<KEY>, AGENTS_CURL*)."
requires = []
routing = [
  """- Fetch a URL without network setup, use the bundled curl shim / syshttp client
  toolkit, or point tools at the OS trust store → $NET_OVERLAY_ROOT/kb/NET.md""",
]
