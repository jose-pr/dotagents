# The net overlay's curl.exe for Windows: pip generates it from the console
# script below when the overlay's setup.py installs this directory, as it does
# for any pip-installed tool. A native program, so no command interpreter
# parses the arguments a caller hands to `curl`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "net-curl-launcher"
# setup.py reinstalls when the installed version differs from this one.
version = "0.1.0"
description = "curl.exe for the dotagents net overlay: runs the overlay's bin/curl.py"
requires-python = ">=3.9"

[project.scripts]
curl = "net_curl_launcher:main"

[tool.hatch.build.targets.wheel]
include = ["net_curl_launcher.py"]
