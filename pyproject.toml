[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Distribution name is `dotagents-cli`; the import package stays `dotagents` (see
# tool.hatch...packages) and the console script stays `dotagents` (project.scripts),
# so `pip install dotagents-cli` gives you `import dotagents` and a `dotagents`
# command.
[project]
name = "dotagents-cli"
version = "0.5.1"
authors = [{ name = "Jose A." }]
description = "The dotagents CLI: install and manage a portable ~/.agents config for AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "duho>=0.5.0,<0.6",
    "pathlib_next>=0.9.0,<0.10",
]

[project.optional-dependencies]
uri = ["pathlib_next[uri]"]
http = ["pathlib_next[http]"]
sftp = ["pathlib_next[sftp]"]
s3 = ["pathlib_next[s3]"]
dev = ["build", "hatchling>=1.27", "pytest", "pyyaml", "pathlib_next[http]"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
dotagents = "dotagents.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/dotagents/"
Repository = "https://github.com/jose-pr/dotagents"
Documentation = "https://jose-pr.github.io/dotagents/"
Issues = "https://github.com/jose-pr/dotagents/issues"

# Private files never ship, even when present in the tree: `*.local.*` is the
# unshared per-machine override convention and `CLAUDE*` is agent config. Hatchling
# also honours .gitignore, which lists both; these excludes hold without it.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/dist", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/dotagents"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
