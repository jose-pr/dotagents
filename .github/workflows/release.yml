name: Release

# Runs when a version tag (e.g. v1.0.0, v1.0.0-rc.1) is pushed. Not wired to
# push/PR events on branches -- this is a release gate, not general CI.
#
# It runs the whole Test workflow (test.yml, via workflow_call) as its gate,
# builds the sdist/wheel, checks that the tag names the version it built,
# builds the self-contained `dotagents.pyz` and smoke-tests that exact file,
# gates on a strict docs build, then creates the GitHub Release and attaches
# the artifacts (including `dotagents.pyz`, so
# https://github.com/jose-pr/dotagents/releases/latest/download/dotagents.pyz
# always resolves to the newest release's pyz). Finally, for final (non
# pre-release) tags only, it publishes the sdist and wheel to PyPI as
# `dotagents-cli` and dispatches docs.yml to deploy the docs at this tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The same matrix, audit, overlay tests and pyz smoke that run on main.
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build distribution (sdist + wheel + pyz)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      # A tag on the wrong commit would otherwise publish a release named for
      # one version that carries another version's artifacts.
      - name: The tag names the version that was built
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG"]
          want = Version(tag[1:] if tag.startswith("v") else tag)
          dist = pathlib.Path("dist")
          built = {str(parse_wheel_filename(p.name)[1]) for p in dist.glob("*.whl")}
          built |= {str(parse_sdist_filename(p.name)[1]) for p in dist.glob("*.tar.gz")}
          if built != {str(want)}:
              sys.exit("tag %s is version %s, but dist/ holds %s" % (tag, want, sorted(built)))
          print("tag %s matches the built version %s" % (tag, want))
      - name: Verify sdist and wheel
        run: |
          ls -l dist/*.tar.gz dist/*.whl
          python -m twine check dist/*.tar.gz dist/*.whl
      # The pyz is a first-class release artifact -- the no-pip install path.
      # `build-pyz` vendors duho/pathlib_next next to the package and runs from
      # the checkout, so the package must be importable (editable install).
      - name: Build dotagents.pyz
        run: |
          python -m pip install -e .
          python -m dotagents build-pyz --out dist/dotagents.pyz
      - name: Fetch the example overlays (`repo` branch)
        uses: actions/checkout@v7
        with:
          ref: repo
          path: overlays-src
      - name: Smoke-test the pyz being released
        shell: bash
        run: bash tools/pyz_smoke.sh dist/dotagents.pyz overlays-src/overlays
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  # Docs are DEPLOYED by docs.yml (D52 -- three workflow files). This job only
  # GATES the release on a strict docs build: a release must never ship if the
  # docs site is broken, but the release path never deploys Pages itself. The
  # docs-deploy job at the end dispatches docs.yml for this tag.
  docs-gate:
    name: Docs build gate (strict, no deploy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install package with docs tooling
        run: python -m pip install -e ".[docs]"
      - name: Build docs (gate only)
        run: mkdocs build --strict

  github-release:
    name: Create GitHub Release
    needs: [build, docs-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        # The tag reaches the script as data (an environment variable), never
        # spliced into its source.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag  # v1.0.0-rc.1 -> 1.0.0-rc.1

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop before the next "## [version]" heading, or before the
          # trailing "[version]: https://..." reference-link block at the
          # end of the file (only relevant when this tag is the oldest
          # tracked release, so there's no next heading to stop at).
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        # Pinned to a commit: this action runs with contents: write.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # Pin the release object to the tagged commit; left unset it defaults
          # to the repo's default branch and every later release can fail note
          # generation with "Invalid target_commitish" after a branch rename.
          target_commitish: ${{ github.sha }}
          # A repo that pushes commits directly (no PR flow) gets a thin/empty
          # auto-generated "What's Changed" on every release -- the scraped
          # CHANGELOG.md section is the real notes; generate_release_notes still
          # appends its own "Full Changelog: <compare link>" after body_path.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md

  # PyPI publish runs AFTER the GitHub release, and only for a final (non
  # pre-release) tag. Ordering matters: a PyPI upload is IRREVERSIBLE -- a
  # version number can never be reused, even after `yank` -- while a GitHub
  # release can be deleted and recreated. Doing the recoverable step first means
  # a failure here never leaves a published version with no release to match.
  #
  # Auth is PyPI Trusted Publishing (OIDC): no API token is stored anywhere. It
  # requires a one-time setup on PyPI for this repo + workflow + environment,
  # under the project's "Publishing" settings.
  pypi-publish:
    name: Publish to PyPI
    needs: [build, github-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dotagents-cli
    permissions:
      id-token: write   # required for Trusted Publishing; nothing else is needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The pyz is a GitHub-release artifact only -- PyPI takes the sdist and
      # wheel, and `upload` rejects anything it does not recognize.
      - name: Keep only sdist + wheel
        run: |
          find dist -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*.whl' -delete
          ls -l dist/
      # skip-existing makes re-running a partially uploaded release safe; the
      # build job's tag/version check keeps it from masking a wrong tag.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Events made with the workflow's own GITHUB_TOKEN, such as the release above,
  # start no workflows, so docs.yml cannot listen for the release itself. A
  # workflow_dispatch is the exception: it deploys the docs at this tag. A
  # pre-release leaves the published docs alone. Off the publish chain, so a
  # docs problem never blocks a package that passed its tests.
  docs-deploy:
    name: Deploy the docs for this release
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docs.yml at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
