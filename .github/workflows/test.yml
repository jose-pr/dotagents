name: Test

# CI for main:
#   - test:     the unit suite on {ubuntu, windows, macos} x {3.9, 3.14} with
#               the dev extra (so no extra-dependent test skips);
#   - audit:    tools/audit.py -- the base overlay, the example overlays'
#               manifests, and their reference templates (3.11+);
#   - overlays: the example overlays' own test suites;
#   - install:  CLI steps (init, overlays, link-project/sync-project) in a
#               scratch HOME;
#   - pyz:      tools/pyz_smoke.sh against a fresh dotagents.pyz, on Linux
#               and Windows.
# The example overlays live on the `repo` branch, checked out into
# ./overlays-src by the jobs that need them.
#
# release.yml runs this workflow as its test gate (workflow_call), so a
# release tag is never the first time any of it runs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
      overlays_ref:
        description: "Ref of the example overlays (the `repo` branch, a tag, or a SHA)"
        required: false
        default: "repo"
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      overlays_ref:
        type: string
        required: false
        default: "repo"
  push:
    branches:
      - main
    tags:
      - "ci-*"
  pull_request:

permissions:
  contents: read

# One run per ref under test; a newer push supersedes an older one only on a
# pull request, so every commit on main keeps its own result.
concurrency:
  group: test-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash everywhere (Git Bash on Windows): GitHub runs it with -eo pipefail, so a
# crashing producer fails its pipeline. A negative check is written as an
# explicit `if ...; then exit 1; fi`, because errexit ignores `! pipeline`.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # the floor and the newest supported
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with the dev extra
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests -q -rs

  audit:
    name: Audit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"] # the default mode must run on the 3.9 floor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Fetch the example overlays (`repo` branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.overlays_ref || 'repo' }}
          path: overlays-src
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        # audit.py's command surface is a duho Cmd, and it reads overlay.toml
        # with dotagents' own manifest reader.
        run: python -m pip install -e .
      - name: Audit repo structure and overlay manifests
        run: python tools/audit.py --root . --overlays overlays-src
      # Personal-leak / hygiene scanning is NOT in CI (D84): it is a personal tool
      # the user runs locally before a push -- CI has no personal patterns to scan
      # for, and audit is structural only.
      - name: Reference template checks (3.11+ only)
        if: matrix.python-version != '3.9'
        run: python tools/audit.py --check-templates --root . --overlays overlays-src

  overlays:
    name: Example overlays' own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Fetch the example overlays (`repo` branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.overlays_ref || 'repo' }}
          path: overlays-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the package with the dev extra
        run: python -m pip install -e ".[dev]"
      - name: Run the overlays' test suites
        # An empty config file keeps main's own pytest settings out of the
        # overlays' run; each overlay brings its own conftest.
        run: |
          printf '[pytest]\n' > "$RUNNER_TEMP/overlays-pytest.ini"
          python -m pytest -c "$RUNNER_TEMP/overlays-pytest.ini" \
            --rootdir overlays-src/overlays overlays-src/overlays -q -rs -p no:cacheprovider

  install:
    name: Install into scratch HOME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the example overlays (`repo` branch)
        # The steps below resolve overlays via --repo overlays-src/overlays.
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.overlays_ref || 'repo' }}
          path: overlays-src
      - name: Install the dotagents CLI package
        run: python -m pip install -e .
      - name: Dry run (minimal base overlay via init)
        run: python install.py init -g --dry-run
      - name: Init lays down the base overlay only
        run: |
          export HOME="$(mktemp -d)"
          python install.py init -g
          test -f "$HOME/.agents/AGENTS.md"
          test ! -e "$HOME/.agents/dotagents"    # no dotagents/ until you add a command
          test ! -e "$HOME/.agents/flows"        # base imposes no flows
      - name: Install base + opt-in overlays by name (overlay dirs)
        run: |
          export HOME="$(mktemp -d)"
          python install.py init -g
          python -m dotagents overlays add engineering python --repo overlays-src/overlays -g
          test -f "$HOME/.agents/AGENTS.md"
          test -f "$HOME/.agents/overlays/engineering/flows/PLAN.md"
          test -f "$HOME/.agents/overlays/python/kb/PYTHON.md"
      - name: Re-adding an overlay is idempotent (skips present files)
        run: |
          export HOME="$(mktemp -d)"
          python install.py init -g
          python -m dotagents overlays add engineering --repo overlays-src/overlays -g
          out=$(python -m dotagents overlays add engineering --repo overlays-src/overlays -g 2>&1)
          grep -qF "skip (exists)" <<<"$out"
      - name: overlays add/list/remove into a scope (discover, not track)
        run: |
          export HOME="$(mktemp -d)"
          python install.py init -g                                   # lay the base AGENTS.md
          # add by name from the bundled source, into the user scope.
          python -m dotagents overlays add python --repo overlays-src/overlays -g
          test -f "$HOME/.agents/overlays/python/kb/PYTHON.md"     # installed as a dir
          test -f "$HOME/.agents/overlays/python/overlay.toml"     # self-describing
          grep -qF "kb/PYTHON.md" "$HOME/.agents/AGENTS.md"        # routing merged
          # list discovers it by presence (no registry file).
          out=$(python -m dotagents overlays list --repo overlays-src/overlays -g)
          grep -qF "python" <<<"$out"
          out=$(python -m dotagents overlays list --repo overlays-src/overlays -g --json)
          grep -qF '"installed"' <<<"$out"
          # glob-filtered sync is a no-op-safe refresh.
          python -m dotagents overlays sync 'py*' --repo overlays-src/overlays -g
          # remove deletes the overlay dir AND recomposes the managed block over what
          # remains, so the routing it merged leaves with it (the un-merge).
          python -m dotagents overlays remove python -g
          test ! -e "$HOME/.agents/overlays/python"
          if grep -qF "kb/PYTHON.md" "$HOME/.agents/AGENTS.md"; then
            echo "overlays remove left the python routing in AGENTS.md" >&2; exit 1
          fi
          # show describes an overlay from the source when it is not installed.
          out=$(python -m dotagents overlays show python --repo overlays-src/overlays -g)
          grep -qF "python (source)" <<<"$out"
      - name: Link a project into the private store, then sync (git bootstrap)
        run: |
          export HOME="$(mktemp -d)"
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          python install.py init -g
          python -m dotagents overlays add private-sync --repo overlays-src/overlays -g
          test -f "$HOME/.agents/overlays/private-sync/kb/PRIVATE_SYNC.md"
          test -f "$HOME/.agents/overlays/private-sync/hooks/private-sync-start.sh"
          # A project with an existing .agents is adopted into the store and symlinked.
          proj="$(mktemp -d)"
          mkdir -p "$proj/.agents/plans"
          echo "seed" > "$proj/.agents/plans/seed.md"
          printf '.agents/\n' > "$proj/.gitignore"
          python -m dotagents link-project "$proj"
          test -L "$proj/.agents"                              # symlinked
          test -f "$HOME/.agents/projects/$(basename "$proj")/plans/seed.md"  # adopted
          grep -qF seed "$proj/.agents/plans/seed.md"          # reachable through the link
          out=$(python -m dotagents link-project "$proj" 2>&1)
          grep -qF "already" <<<"$out"                         # idempotent
          # Bootstrap the private repo as git and commit the store.
          python -m dotagents sync-project --remote https://example.invalid/you/.agents.git --no-pull --no-push -m "init"
          out=$(git -C "$HOME/.agents" ls-files)
          grep -qF "projects/$(basename "$proj")/plans/seed.md" <<<"$out"
      - name: A .agents that is itself a git checkout is never adopted or copied back
        run: |
          export HOME="$(mktemp -d)"
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          python install.py init -g
          # link-project/sync-project come FROM the private-sync overlay (D85), so
          # the overlay MUST be installed before either is used.
          python -m dotagents overlays add private-sync --repo overlays-src/overlays -g
          proj="$(mktemp -d)"; printf '.agents\n' > "$proj/.gitignore"
          git init -q "$proj/.agents"
          echo "checkout" > "$proj/.agents/AGENTS.md"
          git -C "$proj/.agents" add -A && git -C "$proj/.agents" commit -qm seed
          out=$(python -m dotagents link-project "$proj" 2>&1)
          grep -qF "skip:" <<<"$out"
          test -d "$proj/.agents" && test ! -L "$proj/.agents"   # left in place, untouched
          test ! -e "$HOME/.agents/projects/$(basename "$proj")/AGENTS.md"  # not adopted
          out=$(python -m dotagents sync-project --project "$proj" --remote https://example.invalid/you/.agents.git --no-pull --no-push -m "sync" 2>&1)
          grep -qF "skip copy-back" <<<"$out"
          test ! -e "$HOME/.agents/projects/$(basename "$proj")/AGENTS.md"  # not copied back
          # --force backs the checkout up (git state intact) and links the store.
          python -m dotagents link-project "$proj" --force
          test -L "$proj/.agents"
          test -d "$proj/.agents.bak/.git"
      - name: Copy-mode link + copy-back on sync (no-symlink fallback path)
        run: |
          export HOME="$(mktemp -d)"
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          python install.py init -g
          # link-project/sync-project come FROM the private-sync overlay (D85), so
          # the overlay MUST be installed before either is used.
          python -m dotagents overlays add private-sync --repo overlays-src/overlays -g
          proj="$(mktemp -d)"; printf '.agents/\n' > "$proj/.gitignore"
          python -m dotagents link-project "$proj" --copy
          test -d "$proj/.agents" && test ! -L "$proj/.agents"  # real dir, not a symlink
          echo "edit" > "$proj/.agents/plans/local.md"
          python -m dotagents sync-project --project "$proj" --remote https://example.invalid/you/.agents.git --no-pull --no-push -m "sync"
          test -f "$HOME/.agents/projects/$(basename "$proj")/plans/local.md"  # copied back

  pyz:
    name: Built .pyz (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Fetch the example overlays (`repo` branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.overlays_ref || 'repo' }}
          path: overlays-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the dotagents CLI package
        run: python -m pip install -e .
      - name: Build dotagents.pyz
        run: python -m dotagents build-pyz --out dist/dotagents.pyz
      - name: Smoke-test the pyz (flags, help, commands survive the zipapp)
        # Runs in its own scratch HOME/USERPROFILE and working directory.
        run: bash tools/pyz_smoke.sh dist/dotagents.pyz overlays-src/overlays
